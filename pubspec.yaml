name: likeminds_feed
description: Flutter SDK package for LikeMinds feed.
version: 1.6.0
homepage: "https://likeminds.community"

environment:
  sdk: ">=2.18.5 <4.0.0"
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  dio:
  json_annotation:
  json_serializable:
  equatable:
  get_it:
  envied:
  curl_logger_dio_interceptor: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  build_runner:
  envied_generator: ^0.3.0

false_secrets:
 - /*.json