name: likeminds_feed
description: Flutter SDK package for LikeMinds feed, empowers you to integrate personalized and engaging feeds into your Flutter application.
version: 1.12.0
homepage: "https://likeminds.community"

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.4.0
  json_annotation: ^4.8.1
  json_serializable: ^6.7.1
  equatable: ^2.0.5
  get_it: ^7.6.7
  envied: ^0.3.0+3
  device_info_plus: ^9.0.0
  connectivity_plus: ^3.0.6
  stack_trace: ^1.11.0
  curl_logger_dio_interceptor: ^1.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.3
  build_runner: ^2.4.8
  envied_generator: ^0.3.0+3
  hive_generator: ^2.0.1

false_secrets:
  - /*.json
