name: Feed SDK test on every PR

on:
  pull_request:
    branches-ignore: #exclude the branches from the test
      - master
      
jobs:
  run-flutter-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - uses: actions/setup-java@v2 #plugin for setting up the java
        with:
          distribution: "zulu"
          java-version: "11" #define the java version
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - run: flutter pub get #installing the plugins for the flutter project
      
      - name: Lint
        run: flutter analyze > lint-results.txt

      - name: Upload the lint results as an artifact
        if: always()
        uses: actions/upload-artifact@v2
        with:
          name: lint-results
          path: lint-results.txt
      
      - name : Tests
        if: always()
        run: flutter test --dart-define=DEBUG=true
