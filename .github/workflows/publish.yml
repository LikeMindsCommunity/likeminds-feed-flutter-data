# Main Github Actions CI/CD file
name: Publish and Create Release

on:
  push:
    branches:
      - "master"
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v3

      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v1'
        with:
          credentials_json: '${{ secrets.GOOGLE_CREDENTIALS }}'
          
      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v1'
        with:
          version: '>= 363.0.0'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Set up Flutter and dependencies
        run: flutter pub get

      - name: Generate gcloud identity token and publish to pub.dev
        run: |
          export TOKEN=$(gcloud auth print-identity-token --impersonate-service-account="pub-dev@likeminds-nonprod-prj-24e1.iam.gserviceaccount.com" --audiences="https://pub.dev" --include-email)
          if [ $? -eq 0 ]; then
            echo "Identity token successfully generated"
            flutter pub token add https://pub.dev --env-var TOKEN
            flutter pub token list
            flutter pub publish --force
          else
            echo "Error generating identity token"
          fi
        
  create-github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Create Release
        run: gh release create ${{ github.ref }} --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}