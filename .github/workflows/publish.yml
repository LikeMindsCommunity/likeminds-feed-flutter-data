# Main Github Actions CI/CD file
name: Publish and Create Release

on:
  push:
    branches:
      - "master"
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v3

      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v1'
        with:
          credentials_json: '${{ secrets.GOOGLE_CREDENTIALS }}'
          
      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v1'
        with:
          version: '>= 363.0.0'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Set up Flutter and dependencies
        run: flutter pub get

      - name: Generate gcloud identity token and publish to pub.dev
        run: |
          export TOKEN=$(gcloud auth print-identity-token --impersonate-service-account="pub-dev@likeminds-nonprod-prj-24e1.iam.gserviceaccount.com" --audiences="https://pub.dev" --include-email)
          if [ $? -eq 0 ]; then
            echo "Identity token successfully generated"
            flutter pub token add https://pub.dev --env-var TOKEN
            flutter pub token list
            flutter pub publish --force
          else
            echo "Error generating identity token"
          fi

  create_tag:
    name: Create Git Tag
    needs: publish
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
          fetch-depth: 0

    - name: Check for version changes
      run: |
        # Fetch all tags from the remote repository
        git fetch --tags
        
        # Get the previous version from the last release tag
        export previous_version=$(git describe --tags --abbrev=0)
        
        # Get the current version from pubspec.yaml
        export current_version=$(cat pubspec.yaml | grep 'version:' | awk '{print $2}')
        
        if [[ "$previous_version" != "v$current_version" ]]; then
          echo "Version has changed from $previous_version to v$current_version."
        else
          echo "Version has not changed."
          exit 1
        fi

    - name: Push Git Tag
      run: |
        # Git login
        git config --global user.name "$(git log -n 1 --pretty=format:%an)"
        git config --global user.email "$(git log -n 1 --pretty=format:%ae)"

        # Push a Git tag with the new version
        export current_version=$(cat pubspec.yaml | grep 'version:' | awk '{print $2}')
        git tag -a "v$current_version" -m "Version $current_version"
        git push origin "v$current_version"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  create-github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: create_tag
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Create Release
        run: gh release create "$(git describe --tags --abbrev=0)" --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
